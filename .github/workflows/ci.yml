# CI — WHAT THIS DOES AND DOES NOT VERIFY
#
# The migration files live outside this repository by policy, so a runner
# cannot build the schema: `scripts/migrate.py` finds 0 of 15 files. Even with
# them present they are incremental against an existing CRM schema — a blank
# Postgres fails with `relation "opportunities" does not exist`.
#
# So this pipeline deliberately claims LESS than the suite proves locally. It
# runs what is meaningful without a database, and it is named so that nobody
# mistakes a green tick for a verified safety case.
#
# The tests/ directory is also outside this repository by policy, so CI cannot
# run any test at all.
#
# COVERED HERE
#   * every app module imports (222 of them) — catches syntax errors, broken
#     imports and circular dependencies across the whole codebase
#   * the Phase 4 memory benchmark: the derivation pipeline run against a
#     frozen corpus with its own embeddings, so clustering, statements,
#     evidence selection and trust scores are all regression-gated WITHOUT a
#     database
#
# NOT COVERED HERE — all 1039 tests, verified locally against Postgres and on
# Railway by `python -m scripts.verify_invariants` after every deployment:
#   * GDPR erasure actually deleting
#   * append-only enforcement on the verification trail
#   * assertion-gate convergence between explain() and recall()
#   * signature validation and key rotation
#   * the deletion undo log
#
# TO GET FULL COVERAGE: publish tests/, the 15 declared migrations, and a base
# schema (sql/00_base_schema.sql, ~1.7 MiB, 200 tables + 165 stored
# procedures). The integration job below activates on its own once the base
# schema is present.
name: CI

on:
  push: { branches: [master, 'feat/**'] }
  pull_request: { branches: [master] }

jobs:
  checks:
    name: import check
    runs-on: ubuntu-latest
    outputs:
      # `hashFiles()` is not available in a job-level `if:` — only inside
      # steps. Detecting here and exporting the answer is the supported way to
      # gate the job below.
      has_base_schema: ${{ steps.detect_schema.outputs.present }}
    steps:
      # `submodules: recursive` needs a token that can read the PRIVATE
      # governance repository. GITHUB_TOKEN is scoped to this repository only
      # and silently yields an EMPTY governance/ directory, which would look
      # exactly like "no base schema" and skip the gate -- the original defect.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GOVERNANCE_TOKEN }}
          # By default checkout leaves the token in .git/config as an auth
          # header for the rest of the job, where every later step -- and
          # anything a dependency pulls in -- can read it. The submodule fetch
          # happens inside the action, so dropping it afterwards costs nothing.
          persist-credentials: false
      - uses: actions/setup-python@v5
        # 3.12 OR NEWER IS REQUIRED — do not lower this.
        #
        # The codebase uses PEP 701 f-strings (nested same-type quotes), e.g.
        #   f"...{_cal("now() - interval '1 month'")}..."   app/core/metrics.py
        # which is a SyntaxError before 3.12. On 3.11 this step failed with 14
        # modules unable to import, including app.main — the whole application.
        # Railway runs 3.12+, which is the only reason production works; CI was
        # testing a Python the product does not run on, and reported a red tick
        # that said nothing about the deployed environment.
        with: { python-version: '3.12', cache: pip }

      - name: Detect base schema
        id: detect_schema
        run: |
          # Not `-d governance`: `git submodule add` leaves the directory
          # present but EMPTY when the fetch fails, so directory existence is
          # not evidence. The file is.
          if [ -f governance/schema/00_base_schema.sql ]; then
            echo "present=true"  >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::governance/ is empty or missing. The verification"
            echo "::error::gate cannot run. Set the GOVERNANCE_TOKEN secret to"
            echo "::error::a token with read access to Conscestra-CRM-governance."
            exit 1
          fi

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Broadest signal available without a schema: if a module fails to
      # import, everything downstream is meaningless anyway.
      - name: Import every app module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import app
          bad = []
          mods = [m.name for m in pkgutil.walk_packages(app.__path__, "app.")]
          for name in mods:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  bad.append(f"{name}: {type(exc).__name__}: {exc}")
          print(f"imported {len(mods)} modules, {len(bad)} failures")
          for b in bad:
              print("  FAIL", b)
          sys.exit(1 if bad else 0)
          PY

      # Phase 4 gate. Runs the derivation pipeline end to end against a FROZEN
      # corpus that carries its own embeddings — no database, so this is the
      # only behavioural coverage CI has. Any movement in clustering,
      # statements, evidence selection or trust fails the build.
      - name: Memory benchmark (regression gate)
        run: python -m app.core.memory_bench

      - name: State what was not verified
        if: always()
        run: |
          echo "::warning::CI verifies imports + the frozen memory benchmark."
          echo "::warning::tests/ is not published, so all 1088 tests and every"
          echo "::warning::database-layer control are verified locally and on"
          echo "::warning::Railway. Extrinsic quality (topic precision, cluster"
          echo "::warning::validity, usefulness) needs human labels and is"
          echo "::warning::blocked on real data. See this workflow's header."

  # THE GATE. Formerly dormant and formerly conditional -- and a SKIPPED
  # required check counts as a PASSING one, which is how this workflow reported
  # success while verifying nothing. The artefacts now arrive via the
  # `governance` submodule, so the condition has no remaining justification and
  # has been removed. If the submodule cannot be fetched, `checks` fails above
  # and this never gets the chance to be silently green.
  integration:
    name: full suite (needs base schema)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        # pgvector, not stock postgres: the baseline issues CREATE EXTENSION
        # vector, and on postgres:16 that aborts the restore.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crmdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/crmdb
      # An environment-shaped skip becomes a failure here.
      CRM_REQUIRE_DB: '1'
      MEMORY_SIGNING_KEY: ci-signing-key-not-for-production
      MEMORY_SIGNING_KEY_ID: ci1
      DB_POOL_MAX: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GOVERNANCE_TOKEN }}
          # By default checkout leaves the token in .git/config as an auth
          # header for the rest of the job, where every later step -- and
          # anything a dependency pulls in -- can read it. The submodule fetch
          # happens inside the action, so dropping it afterwards costs nothing.
          persist-credentials: false
      - uses: actions/setup-python@v5
        # 3.12+ required — see the import-check job above.
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt

      # One command, fail-closed: provision, baseline, migrations, seed,
      # controls. A stage that cannot run is a FAILURE there, never a skip,
      # so this cannot report success having verified less than it claims.
      - name: Verification gate
        run: python -m scripts.verify_gate

      # The wider suite, beyond the gate-viable controls.
      - run: python -m pytest -q --tb=short
      - run: python -m scripts.verify_invariants

      # The count in any report must be derived from the repository, not typed
      # into it. Non-zero if a gate artefact is untracked.
      - run: python -m scripts.control_inventory
