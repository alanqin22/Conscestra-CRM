; Test-run configuration.
;
; THE DEFECT THIS EXISTS TO KILL. There was no pytest config of any kind, so a
; bare `python -m pytest` took the repository root as its start directory and
; walked EVERYTHING under it — `venv/` included. Collection never finished: the
; run hung before a single test executed, burning >25 minutes with ~4 seconds of
; CPU, because it was blocked on import, not computing anything.
;
; The failure was badly disguised. `pytest tests/` collects 1,234 tests in under
; five seconds and every individual test file collects fine on its own, so the
; obvious bisections all came back clean — the hang only appears when the walk
; reaches a directory nobody thinks of as test code.
;
; `testpaths` applies ONLY when no path argument is given, so explicit
; invocations (`pytest tests/test_routing.py`, `pytest -k foo tests/`) behave
; exactly as before.

[pytest]
; The suite moved into the `governance` submodule; see
; app/core/artifact_paths.py for why the artefacts are not at the root.
testpaths = governance/tests

; Belt and braces: if someone does pass an explicit path that happens to
; contain one of these, do not descend into it. `venv` and `scratch` are the two
; that actually hung; the rest are listed because they are equally not test code
; and the next person should not have to rediscover why the run stopped.
norecursedirs =
    venv
    .venv
    scratch
    backups
    node_modules
    __pycache__
    .git
    image
    logo
    video
    data
    sp
    sql
